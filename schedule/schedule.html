<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Schedule | LPU Cavite LMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<script src="../assets/page-transition.js"></script>
<link rel="stylesheet" href="schedule.css">
</head>
<body>
<!-- Icon set used by the sidebar (same as the other pages) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-person" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></symbol>
<symbol id="i-dash" viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></symbol>
<symbol id="i-grad" viewBox="0 0 24 24"><path d="M5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82zM12 3L1 9l11 6 9-4.91V17h2V9L12 3z"/></symbol>
<symbol id="i-tasks" viewBox="0 0 24 24"><path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1s-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm2 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></symbol>
<symbol id="i-cal" viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zM9 14H7v-2h2v2zm4 0h-2v-2h2v2zm4 0h-2v-2h2v2z"/></symbol>
<symbol id="i-out" viewBox="0 0 24 24"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5-5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></symbol>
</defs></svg>

<!-- SECTION: Header (logo + top navigation). Rendered by ../header/header.js -->
<div id="site-header"></div>

<div class="layout">

  <!-- SECTION: Sidebar (same as the other pages; Schedule is the active item) -->
  <aside class="sidebar">
    <div class="profile">
      <div class="avatar"><svg class="ic"><use href="#i-person"/></svg></div>
      <strong class="hello" id="user-name"></strong>
      <!-- Mobile only: opens/closes the sidebar menu (see setupMobileMenu() in schedule.js) -->
      <button class="menu-toggle" id="menu-toggle" aria-expanded="false" aria-controls="sidebar-menu">☰ Menu</button>
      <small class="student-section" id="user-section"></small>
    </div>
    <nav class="menu" id="sidebar-menu">
      <a href="../homepage/homepage.html"><svg class="ic"><use href="#i-dash"/></svg> Dashboard</a>
      <a href="../my-courses/courses.html"><svg class="ic"><use href="#i-grad"/></svg> My Courses</a>
      <a href="../homepage/view%20tasks/tasks.html"><svg class="ic"><use href="#i-tasks"/></svg> View Tasks</a>
      <a class="active" href="schedule.html"><svg class="ic"><use href="#i-cal"/></svg> Schedule</a>
    </nav>
    <a class="logout" href="../login/login.html" id="logout-link"><svg class="ic"><use href="#i-out"/></svg> Log out</a>
  </aside>

<main class="sch">
  <!-- SECTION: Top row (title, Daily/Weekly/Monthly switch, numbers) -->
  <div class="sch-top">
    <div><h1>My Schedule</h1><p>Your classes and deadlines at a glance. <a href="../homepage/homepage.html">&larr; Back to Dashboard</a></p></div>
    <div class="views" id="views">
      <button data-view="daily">Daily</button><button data-view="weekly" class="on">Weekly</button><button data-view="monthly">Monthly</button>
    </div>
    <div class="stats">
      <div><small>Classes this week</small><b id="st-classes"></b></div>
      <div><small>Class hours</small><b id="st-hours"></b></div>
    </div>
  </div>

  <div class="sch-body">
    <aside class="side">
      <!-- SECTION: Mini calendar -->
      <section class="panel mini">
        <div class="mini-head"><b id="mini-title"></b><span><button id="mini-prev" aria-label="Previous month">&lsaquo;</button><button id="mini-next" aria-label="Next month">&rsaquo;</button></span></div>
        <div class="mini-grid" id="mini-grid"></div>
      </section>
      <!-- SECTION: My Tasks checklist -->
      <section class="panel"><div class="p-head"><h2>My Tasks</h2><span>Checklist</span></div><ul class="check-list" id="task-checks"></ul></section>
      <!-- SECTION: Other Calendar -->
      <section class="panel"><div class="p-head"><h2>Other Calendar</h2><span>School</span></div><ul class="check-list" id="other-cal"></ul></section>
    </aside>

    <!-- SECTION: Calendar board (filled by schedule.js) -->
    <section class="board">
      <div class="board-head">
        <h2 id="range"></h2>
        <div class="nav"><button id="today-btn">Today</button><button id="prev" aria-label="Previous">&lsaquo;</button><button id="next" aria-label="Next">&rsaquo;</button></div>
      </div>
      <div class="board-scroll" id="grid"></div>
    </section>
  </div>
</main>

</div>

<script src="../header/header.js"></script>
<script src="../footer/footer.js"></script>
<script src="../auth/auth.js"></script>
<script src="schedule.js"></script>
</body>
</html>
