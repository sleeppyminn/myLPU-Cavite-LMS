<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Page transition: same file as every other page -->
<script src="../../assets/page-transition.js"></script>
<title>View Tasks | LPU Cavite LMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="tasks.css">
</head>
<body>

<!-- Icon set used by the sidebar and the page (same set as courses.html, plus a chevron for the task rows) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-person" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></symbol>
<symbol id="i-dash" viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></symbol>
<symbol id="i-grad" viewBox="0 0 24 24"><path d="M5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82zM12 3L1 9l11 6 9-4.91V17h2V9L12 3z"/></symbol>
<symbol id="i-tasks" viewBox="0 0 24 24"><path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1s-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm2 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></symbol>
<symbol id="i-cal" viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zM9 14H7v-2h2v2zm4 0h-2v-2h2v2zm4 0h-2v-2h2v2z"/></symbol>
<symbol id="i-out" viewBox="0 0 24 24"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5-5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></symbol>
<symbol id="i-chev" viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6z"/></symbol>
</defs></svg>

<!-- SECTION: Header (logo + top navigation). Rendered by ../../header/header.js -->
<div id="site-header"></div>

<div class="layout">

  <!-- SECTION: Sidebar (same as the other pages; View Tasks is the active item) -->
  <aside class="sidebar">
    <div class="profile">
      <div class="avatar"><svg class="ic"><use href="#i-person"/></svg></div>
      <strong class="hello" id="user-name"></strong>
      <!-- Mobile only: opens/closes the sidebar menu (see setupMobileMenu() in tasks.js) -->
      <button class="menu-toggle" id="menu-toggle" aria-expanded="false" aria-controls="sidebar-menu">☰ Menu</button>
      <small class="student-section" id="user-section"></small>
    </div>
    <nav class="menu" id="sidebar-menu">
      <a href="../homepage.html"><svg class="ic"><use href="#i-dash"/></svg> Dashboard</a>
      <a href="../../my-courses/courses.html"><svg class="ic"><use href="#i-grad"/></svg> My Courses</a>
      <a class="active" href="tasks.html"><svg class="ic"><use href="#i-tasks"/></svg> View Tasks</a>
      <a href="../../schedule/schedule.html"><svg class="ic"><use href="#i-cal"/></svg> Schedule</a>
    </nav>
    <a class="logout" href="../../login/login.html" id="logout-link"><svg class="ic"><use href="#i-out"/></svg> Log out</a>
  </aside>

  <main class="content">

    <!-- SECTION: Page title -->
    <div class="top-row"><h1>View Tasks</h1></div>

    <!-- SECTION: Task progress (ring + legend). Filled by renderProgress() -->
    <section class="progress" aria-labelledby="progress-title">
      <h2 class="progress-title" id="progress-title">Your Task Progress:</h2>
      <div class="progress-body">
        <div class="donut" id="donut" role="img"><div class="donut-center"><strong id="donut-pct"></strong><small>Completed</small></div></div>
        <ul class="legend" id="donut-legend"></ul>
      </div>
    </section>

    <!-- SECTION: Task table. Filled by renderTasks() -->
    <section class="task-table" aria-label="Your tasks">
      <div class="t-head" aria-hidden="true">
        <span>Subject</span><span>Due Date</span><span>Priority</span><span>Completion Status</span><span></span>
      </div>
      <div id="task-rows"></div>
    </section>

  </main>
</div>

<script src="../../header/header.js" onerror="console.warn('Header not found: check the path ../../header/header.js')"></script>
<script src="../../auth/auth.js"></script>
<script src="tasks.js"></script>
</body>
</html>
