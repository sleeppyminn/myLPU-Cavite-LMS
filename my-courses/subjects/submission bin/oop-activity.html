      <header class="act-head">
        <span class="act-tag" id="act-module"></span>

        <div class="act-meta">

        <h3 class="block-title" id="status-title">Submission status</h3>
        <table class="status-table"><tbody id="status-rows"></tbody></table>
      </section>

      <section class="block" aria-labelledby="bin-title">
        <h3 class="block-title" id="bin-title">Submission bin</h3>
        <div id="bin"></div>
