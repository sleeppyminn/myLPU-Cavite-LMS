<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="../assets/page-transition.js"></script>
<title>My Courses | LPU Cavite LMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="courses.css">
</head>
<body>

<!-- Icon set used by the sidebar and the top links -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-person" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></symbol>
<symbol id="i-dash" viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></symbol>
<symbol id="i-grad" viewBox="0 0 24 24"><path d="M5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82zM12 3L1 9l11 6 9-4.91V17h2V9L12 3z"/></symbol>
<symbol id="i-tasks" viewBox="0 0 24 24"><path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1s-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm2 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></symbol>
<symbol id="i-cal" viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zM9 14H7v-2h2v2zm4 0h-2v-2h2v2zm4 0h-2v-2h2v2z"/></symbol>
<symbol id="i-out" viewBox="0 0 24 24"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5-5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></symbol>
</defs></svg>

<!-- SECTION: Header (logo + top navigation). Rendered by ../header/header.js -->
<div id="site-header"></div>

<div class="layout">

  <!-- SECTION: Sidebar (student profile, menu, log out) -->
  <aside class="sidebar">
    <div class="profile">
      <div class="avatar"><svg class="ic"><use href="#i-person"/></svg></div>
      <strong class="hello" id="user-name"></strong>
      <!-- Mobile only: opens/closes the sidebar menu (see setupMobileMenu() in courses.js) -->
      <button class="menu-toggle" id="menu-toggle" aria-expanded="false" aria-controls="sidebar-menu">☰ Menu</button>
      <small class="student-section" id="user-section"></small>
    </div>
    <nav class="menu" id="sidebar-menu">
      <a href="../homepage/homepage.html"><svg class="ic"><use href="#i-dash"/></svg> Dashboard</a>
      <a class="active" href="courses.html"><svg class="ic"><use href="#i-grad"/></svg> My Courses</a>
      <a href="../homepage/view%20tasks/tasks.html"><svg class="ic"><use href="#i-tasks"/></svg> View Tasks</a>
      <a href="#"><svg class="ic"><use href="#i-cal"/></svg> Schedule</a>
    </nav>
    <a class="logout" href="../login/login.html" id="logout-link"><svg class="ic"><use href="#i-out"/></svg> Log out</a>
  </aside>

  <main class="content">
    <!-- SECTION: Page title -->
    <div class="top-row"><h1>My Courses</h1></div>

    <!-- SECTION: Course search bar. Handled by setupSearch() -->
    <div class="search">
      <input id="search-input" type="text" placeholder="Search for courses..." aria-label="Search for courses">
      <button id="search-btn" aria-label="Search"><svg class="ic"><use href="#i-search"/></svg></button>
    </div>

    <!-- SECTION: Course cards. Filled by renderCourses() -->
    <h2 class="section-title">Course</h2>
    <section class="course-grid" id="course-grid"></section>
    <p class="empty" id="empty" hidden>No courses found.</p>
  </main>
</div>

<!-- Same header file as the homepage. If the header is missing, open the console (F12): this path must point to your header folder -->
<script src="../header/header.js" onerror="console.warn('Header not found: check that the header folder is next to the courses folder (path ../header/header.js)')"></script>
<script src="../auth/auth.js"></script>
<script src="courses.js"></script>
</body>
</html>
