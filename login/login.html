<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Log in | LPU Cavite LMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="login.css">
</head>
<body>

<!-- SECTION: Opening animation (logo + waves) -->
<div class="splash" id="splash" aria-hidden="true">
  <div class="waves"><i></i><i></i><i></i></div>
  <div class="splash-logo"><img src="../assets/lpu-logo.png" alt="Lyceum of the Philippines University Cavite"></div>
</div>

<!-- SECTION: Background video (campus AVP, muted + looping) -->
<div class="bg" aria-hidden="true">
  <video id="bg-video" autoplay muted loop playsinline preload="auto" poster="../assets/login-bg-poster.jpg">
    <source src="../assets/login-bg.mp4" type="video/mp4">
  </video>
  <div class="bg-tint"></div>
</div>

<!-- SECTION: Mute / unmute the background video sound -->
<button class="sound-btn" id="sound-btn" type="button" aria-pressed="false" aria-label="Unmute background sound">
  <svg class="ic-off" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M16.5 12A4.5 4.5 0 0 0 14 7.97v2.21l2.45 2.45c.03-.2.05-.41.05-.63zM19 12c0 .94-.2 1.82-.54 2.64l1.51 1.51A8.8 8.8 0 0 0 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3 3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06a8.99 8.99 0 0 0 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4 9.91 6.09 12 8.18V4z"/></svg>
  <svg class="ic-on" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
  <span class="sound-label">Sound off</span>
</button>

<!-- SECTION: Log in card (accounts are provided by the school, so there is no sign up) -->
<main class="auth">
  <section class="auth-card">
    <div class="brand">
      <img class="brand-logo" src="../assets/lpu-logo.png" alt="Lyceum of the Philippines University Cavite">
      <p>Log in with your LPU network account.</p>
    </div>

    <form id="login-form" novalidate autocomplete="on">
      <label class="field">
        <span>LPU email</span>
        <input id="login-email" name="email" type="text" inputmode="email" autocomplete="username" placeholder="2026-2-00xxx@lpunetwork.edu.ph" required>
      </label>
      <label class="field">
        <span>Password</span>
        <div class="pw">
          <input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="Your password" required>
          <button type="button" class="pw-toggle" data-target="login-password">Show</button>
        </div>
      </label>
      <label class="check-row"><input type="checkbox" id="login-remember"> Keep me logged in</label>
      <p class="notice err" id="login-error" hidden></p>
      <button class="btn" id="login-btn" type="submit">Log in</button>
    </form>
  </section>
</main>

<!-- SECTION: After-login animation (circle expands, then goes to the homepage) -->
<div class="transition" id="transition" aria-live="polite">
  <div class="tr-circle"></div>
  <div class="tr-content">
    <svg class="tr-check" viewBox="0 0 52 52" aria-hidden="true">
      <circle cx="26" cy="26" r="24" fill="none" stroke="#fff" stroke-width="3"/>
      <polyline points="14,27 23,36 39,18" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <h2 id="tr-title">Welcome back!</h2>
    <p>Preparing your dashboard…</p>
    <div class="bar"><i></i></div>
  </div>
</div>

<script src="../auth/auth.js"></script>
<script src="login.js"></script>
</body>
</html>
